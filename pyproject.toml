[project]
name = "emotional-graphs"
version = "0.1.0"
description = "Pipeline de grafos emocionais para analise de roteiros cinematograficos"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "beautifulsoup4>=4.12",
    "datasets>=2.14",
    "vaderSentiment>=3.3.2",
    "NRCLex>=4.0",
    "nltk>=3.8",
    "networkx>=3.1",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
